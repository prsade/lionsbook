[files]
# 1 = Split at \section level (keeps \subsection 1.1, 1.2, etc. on the same page)
split-level=1

[document]
# Show sections in the TOC even if they don't generate their own file
toc-non-files=true
toc-depth=2

[images]
# Help imager on Windows: prefer pdftoppm (from poppler/MiKTeX) + dvisvgm for vector
imager = pdftoppm
resolution = 144
# Use vector (dvisvgm) when possible for clean diagrams (the cblock pictures)
vector-imager = dvisvgm