name: Deploy to GitHub Pages

on:
  push:
    branches:
      - main
      - master
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # IMPORTANT for Polish bilingual version:
      # The commentary in lionc/ is the pre-translated (Polish + English tooltips)
      # version. It is committed manually after running `make lions` locally.
      #
      # We do NOT run `make lions` (or the translation script) in this workflow.
      # This prevents re-translation on GitHub and ensures the exact committed
      # version is what gets deployed.
      #
      # Update process (when .tex sources change):
      #   1. git pull
      #   2. make lions   (or .\build.ps1)
      #   3. git add -f lionc/
      #   4. git commit -m "chore: update Polish bilingual commentary + tooltips"
      #   5. git push
      #
      # The committed lionc/ (with Polish text + original English in title tooltips)
      # will be served by GitHub Pages.

      - name: Setup Pages
        uses: actions/configure-pages@v4

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: '.'

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
