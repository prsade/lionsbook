name: Deploy to GitHub Pages

on:
  push:
    branches:
      - main
      - master
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      # Opt into Node.js 24 to avoid deprecation warnings for actions using Node 20
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: "Set up Python"
        uses: actions/setup-python@v6
        with:
          python-version-file: ".python-version"
      
      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          # Install a specific version of uv.
          version: "0.11.3"

      # IMPORTANT:
      # The bilingual Polish version (with original English in tooltips) is
      # pre-generated locally using scripts/add-bilingual-tooltips.py and
      # committed into the lionc/ directory.
      #
      # We deliberately do NOT run "make lions" here. Running it would
      # re-generate the English version and re-run the translation script
      # (which requires internet + the deep-translator package).
      #
      # To update the Polish commentary after changing the .tex sources:
      #   1. git pull
      #   2. make lions          (or .\build.ps1 on Windows)
      #   3. git add -f lionc/
      #   4. git commit -m "Update Polish bilingual commentary"
      #   5. git push
      #
      # The committed lionc/ (Polish + tooltips) will be what GitHub Pages serves.

      - name: Setup Pages
        uses: actions/configure-pages@v4

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: '.'

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
